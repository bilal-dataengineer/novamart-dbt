version: 2

models:
  - name: stg_lineitem
    description: "Staging model for order line items."

    columns:
      - name: order_id
        data_tests:
          - not_null

      - name: line_number
        data_tests:
          - not_null

      - name: part_id
        data_tests:
          - not_null

      - name: extended_price
        data_tests:
          - not_null

      - name: return_flag
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "N", "R"]

      - name: line_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["O", "F"]
