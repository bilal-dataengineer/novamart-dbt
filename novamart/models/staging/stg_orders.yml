version: 2

models:
  - name: stg_orders
    description: "Cleaned staging model for customer orders."

    columns:
      - name: order_id
        description: "Unique identifier for each order."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["O", "F", "P"]

      - name: order_date
        data_tests:
          - not_null
