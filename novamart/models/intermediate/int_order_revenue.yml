version: 2

models:
  - name: int_order_revenue
    description: "Order-level revenue aggregated from line items."

    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: revenue_before_tax
        data_tests:
          - not_null

      - name: revenue_with_tax
        data_tests:
          - not_null
