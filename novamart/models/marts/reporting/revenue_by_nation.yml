version: 2

models:
  - name: revenue_by_nation
    description: "Revenue summary by nation and region."

    columns:
      - name: nation_name
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null

      - name: total_revenue_before_tax
        data_tests:
          - not_null

      - name: total_revenue_with_tax
        data_tests:
          - not_null
