version: 2

models:
  - name: fct_revenue
    description: "Order-line-level revenue fact table for NovaMart."

    columns:
      - name: order_id
        description: "Identifier of the customer order."
        data_tests:
          - not_null

      - name: line_number
        description: "Line number within the order."
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: quantity
        data_tests:
          - not_null

      - name: revenue_before_tax
        data_tests:
          - not_null

      - name: revenue_with_tax
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - line_number
