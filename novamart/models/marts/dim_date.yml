version: 2

models:
  - name: dim_date
    description: "Calendar dimension for NovaMart analytics."

    columns:
      - name: date_key
        description: "Unique date identifier in YYYYMMDD format."
        data_tests:
          - unique
          - not_null

      - name: full_date
        data_tests:
          - unique
          - not_null

      - name: year
        data_tests:
          - not_null

      - name: month
        data_tests:
          - not_null

      - name: quarter
        data_tests:
          - not_null

      - name: day
        data_tests:
          - not_null
