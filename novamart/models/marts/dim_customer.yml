version: 2

models:
  - name: dim_customer
    description: "Customer dimension for NovaMart analytics."

    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: customer_name
        data_tests:
          - not_null

      - name: nation_id
        data_tests:
          - not_null

      - name: nation_name
        data_tests:
          - not_null

      - name: region_id
        data_tests:
          - not_null

      - name: region_name
        data_tests:
          - not_null
